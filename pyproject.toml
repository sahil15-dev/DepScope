[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "depscope"
dynamic = ["version"]
description = "Local dependency advisory scanning and history"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "anyio>=4.8,<5",
    "certifi>=2025.4.26",
    "cvss>=3.6,<4",
    "fastapi>=0.115.12,<1",
    "httpx>=0.28.1,<0.29",
    "packaging>=25,<27",
    "pydantic>=2.11,<3",
    "semver>=3.0.4,<4",
    "sqlalchemy>=2.0.41,<2.1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
depscope = "depscope.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.setuptools.dynamic]
version = {attr = "depscope.__version__"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["depscope*"]
namespaces = false

[tool.setuptools.package-data]
"depscope.fixtures" = ["osv.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/depscope", "backend/tests", "migrations", "e2e/fixture_app.py"]

[[tool.mypy.overrides]]
module = "cvss.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["depscope"]

[tool.coverage.report]
show_missing = true
precision = 2
